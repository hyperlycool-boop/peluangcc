name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `next build` generates next-env.d.ts, which typecheck needs.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run build:html
      - run: npm run eval:export
